<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | NANUS KWASU</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f5;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.card {
  background: white;
  width: 100%;
  max-width: 420px;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h2 {
  color: #06351e;
  margin-top: 0;
}

p {
  color: #68746e;
  line-height: 1.5;
}

label {
  display: block;
  margin: 15px 0 6px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccd8d2;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 20px;
  background: #087f3e;
  color: white;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
}

button:disabled {
  opacity: .6;
}

#message {
  margin-top: 15px;
  font-size: 14px;
  line-height: 1.5;
}

a {
  color: #087f3e;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

<h2>Reset Your Password</h2>

<p>Enter your new password below.</p>

<form id="resetForm">

<label for="newPassword">New Password</label>
<input
  type="password"
  id="newPassword"
  minlength="8"
  required
  autocomplete="new-password"
  placeholder="Enter new password"
>

<label for="confirmPassword">Confirm Password</label>
<input
  type="password"
  id="confirmPassword"
  minlength="8"
  required
  autocomplete="new-password"
  placeholder="Confirm new password"
>

<button type="submit" id="resetBtn">
Reset Password
</button>

</form>

<div id="message"></div>

<p>
<a href="admin.html">Back to Admin Login</a>
</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://risxjzdxrtzhlkwxhhzm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_x9ZKrx8ilp1_Nj4F8U_i5A__eTKwWFx";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const button = document.getElementById("resetBtn");

let recoveryReady = false;

async function checkRecovery() {

  message.textContent = "Verifying reset link...";

  const {
    data,
    error
  } = await db.auth.getSession();

  if (error || !data.session) {

    message.textContent =
      "This reset link is invalid or has expired. Please request another password reset link.";

    form.style.display = "none";
    return;

  }

  recoveryReady = true;

  message.textContent =
    "Reset link verified. You can now choose a new password.";

}

form.addEventListener("submit", async function(e) {

  e.preventDefault();

  if (!recoveryReady) {
    message.textContent =
      "Your reset link is not valid. Request a new one.";
    return;
  }

  const password =
    document.getElementById("newPassword").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password.length < 8) {
    message.textContent =
      "Password must contain at least 8 characters.";
    return;
  }

  if (password !== confirmPassword) {
    message.textContent =
      "Passwords do not match.";
    return;
  }

  button.disabled = true;
  button.textContent = "Updating...";

  const { error } = await db.auth.updateUser({
    password: password
  });

  if (error) {

    message.textContent =
      "Password update failed: " + error.message;

    button.disabled = false;
    button.textContent = "Reset Password";
    return;

  }

  message.textContent =
    "Your password has been changed successfully. You can now sign in with your new password.";
